<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · BMU Campus Eats</title><link rel="stylesheet" href="/designs/css/site.css"><link rel="stylesheet" href="/designs/css/admin.css"><script defer src="/designs/scripts/admin.js"></script></head><body><header class="campus-bar"><a class="wordmark" href="index.html">BMU Campus Eats</a><span>Administration</span></header><main class="admin-page"><h1>Campus operations</h1><p>Project demonstration data</p><form id="admin-login"><label>Admin password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form><p id="admin-status" role="status"></p><div id="admin-dashboard" hidden><nav class="admin-tabs"><a href="#overview">Overview</a><a href="#admin-orders">Orders</a><a href="#restaurants">Restaurants</a><a href="#menu-management">Menu</a><a href="#offer-management">Offers</a></nav><section id="overview"><h2>Overview</h2><div id="metrics"></div><h3>Order totals by day</h3><div id="sales-chart"></div><h3>Most ordered items in this demo</h3><ol id="popular-items"></ol></section><section id="admin-orders"><h2>Recent orders</h2><div id="order-management"></div></section><section id="restaurants"><h2>Restaurant availability</h2><div id="restaurant-management"></div></section><section id="menu-management"><h2>Menu management</h2><form id="add-item"><label>Restaurant<select name="shop" required></select></label><label>Food name<input name="dish" maxlength="120" required></label><label>Category<input name="category" maxlength="80" required></label><label>Price ₹<input name="price" type="number" min="0" max="10000" step="0.01" required></label><button>Add item</button></form><label>Manage restaurant<select id="manage-shop"></select></label><div id="admin-menu"></div></section><section id="offer-management"><h2>Demo coupons and offers</h2><form id="add-offer"><label>Offer title<input name="title" maxlength="120" required></label><label>Code<input name="code" pattern="[A-Z0-9]{3,20}" required></label><label>Discount %<input name="percent" type="number" min="1" max="100" required></label><button>Add demo offer</button></form><div id="admin-offers"></div></section></div></main></body></html>
