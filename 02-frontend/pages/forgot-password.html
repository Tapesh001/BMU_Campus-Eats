<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Reset password · BMU Campus Eats</title><link rel="stylesheet" href="/styles/site.css"><link rel="stylesheet" href="/styles/forgot-password.css"><script defer src="/scripts/password-reset.js"></script></head>
<body><header class="campus-bar"><a class="wordmark" href="index.html"><img src="assets/5733f.png" width="42" height="42" alt=""> BMU Campus Eats <small>STUDENT</small></a><nav aria-label="Main navigation"><a href="index.html">Home</a><a href="login.html">Login</a></nav></header>
<main class="account-wrap"><section class="account-card"><small class="eyebrow">ACCOUNT RECOVERY</small><h1>Forgot your password?</h1><p>We’ll send a six-digit reset code to your registered BMU email.</p>
<form id="request-code"><label>BMU email<input name="email" type="email" required maxlength="160" autocomplete="email" placeholder="student@bmu.edu.in" pattern="[^@ ]+@[bB][mM][uU]\.[eE][dD][uU]\.[iI][nN]" title="Use your registered @bmu.edu.in email"></label><button type="submit">Send reset code</button></form>
<form id="reset-password" hidden><p id="reset-recipient"></p><label>Six-digit code<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required></label><label>New password<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><label>Confirm new password<input name="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><button type="submit">Reset password</button><button id="resend-code" type="button">Send another code</button><button id="change-email" type="button">Use a different email</button></form>
<p id="reset-status" role="status" aria-live="polite"></p><a href="login.html">Back to login</a><noscript><p>Enable JavaScript to request a reset code.</p></noscript></section></main></body></html>
